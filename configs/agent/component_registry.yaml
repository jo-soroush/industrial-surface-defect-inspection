      - frontend_bundle_status.track_b
      - frontend_bundle_status.detection
      - image_inspection.endpoint_status
    traceability_fields:
      - frontend_bundle_paths
    raw_allowed: false
    safe_explanation_scope: Explain which dashboard evidence areas are available and where to review them.
    limitations:
      - Derived from dashboard bundle availability and static page copy.
      - No production-ready claim.
      - No deployment-safe claim.
    readiness_status: PARTIAL_EVIDENCE
    fallback_message: Overview capability evidence is unavailable.
    explanation_priority: high

