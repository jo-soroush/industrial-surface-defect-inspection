  dashboard users who need plain-language context for governed inspection
  evidence.
allowed_sources:
  - global_context
  - section_registry
  - frontend_evidence_bundles
  - inspection_response
  - decision_output
  - model_outputs
  - traceability
  - warnings
  - limitations
  - technical_evidence_references
forbidden_claims:
  - production-ready
  - production ready
  - ready for production
  - production readiness
  - factory ready
  - factory use
  - deployment-safe
  - deployment safe
  - safe for deployment
  - deploy safely
  - deploy this
  - deployed system
  - autonomous ai decision
  - autonomous decision
  - autonomous ai
  - replace human review
  - replace manual review
  - replace human reviewer
  - no human review needed
  - invented evidence
  - invented metrics
  - invented predictions
  - fake metrics
  - fake predictions
safety_boundaries:
  - No production-ready claim.
  - No deployment-safe claim.
  - No autonomous decision claim.
  - No secret leakage.
  - No invented metrics or predictions.
