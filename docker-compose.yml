services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      AGENT_ENABLE_LLM: ${AGENT_ENABLE_LLM:-false}
      AGENT_ENABLE_REAL_PROVIDER_RUNTIME: ${AGENT_ENABLE_REAL_PROVIDER_RUNTIME:-false}
      AGENT_DEFAULT_PROVIDER: ${AGENT_DEFAULT_PROVIDER:-mock}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-mock,gemini,grok}
      LLM_ENABLE_FALLBACK: ${LLM_ENABLE_FALLBACK:-true}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - api
    ports:
      - "8501:8501"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      STREAMLIT_API_BASE_URL: ${STREAMLIT_API_BASE_URL:-http://api:8000}
    command:
      - streamlit
      - run
      - frontend/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
