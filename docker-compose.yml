version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      AGENT_ENABLE_LLM: "false"
      AGENT_DEFAULT_PROVIDER: mock
      LLM_PROVIDER_ORDER: mock,gemini,grok
      LLM_ENABLE_FALLBACK: "true"
      LOG_LEVEL: INFO
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
