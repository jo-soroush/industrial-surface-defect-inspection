identity:
  run_config_id: cnn_train_supervised_v0_4_0
  description: Clean full-epoch CNN v0.4 training run config for Track A supervised MVTec classification.
  task_type: classification
  is_experiment: false
  track_id: classification

model_identity:
  model_name: cnn
  model_type: cnn
  model_version: 0.4.0
  model_config_id: cnn_supervised_config

dataset_binding:
  dataset_id: mvtec_classification_supervised
  dataset_version: mvtec_1.0
  split_manifest_path: data/manifests/split_mvtec_classification_supervised.yaml
  class_mapping_path: configs/data/class_mapping_mvtec_binary.yaml

preprocessing:
  preprocessing_policy_path: configs/data/preprocessing_mvtec.yaml
  preprocessing_version: preprocessing_policy_1.0
  augmentation_policy_version: null

training_runtime:
  batch_size: 32
  learning_rate: 0.0005
  epochs: 25
  optimizer: adam
  loss_function: cross_entropy
  seed: 42
  device: auto
  full_epoch_training: true
  # Intentionally no class_weighting here. CNN v0.3 used inverse_class_frequency and
  # improved recall, but it also produced many false positives; v0.4 should test a
  # cleaner unweighted baseline first.

checkpoint:
  enabled: true
  save_best: false
  save_last: true

early_stopping:
  enabled: false
  patience: 5

output_control:
  save_artifact: true
  save_metadata: true
  save_logs: true
  save_metrics: true
